<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANatical - Profile</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="page profile-page">

  <!-- PROFILE HEADER -->
  <div class="profile-control-bar">
    <button class="profile-left-btn">Fanbase</button>

    <div class="profile-title-block">
      <h2>Sleddogg</h2>
      <p>Oilers till I die</p>
    </div>

    <button class="profile-add-btn">+</button>
  </div>

  <!-- PHOTO STRIP -->
  <div class="profile-photo-strip">

    <div class="photo-card">
      <div class="photo-placeholder">Game Face</div>
    </div>

    <div class="photo-card">
      <div class="photo-placeholder">Fan Cave</div>
    </div>

    <div class="photo-card">
      <div class="photo-placeholder">Memorabilia</div>
    </div>

  </div>

  <!-- STATS PANEL -->
  <div class="profile-stats-panel">

    <div class="profile-stats-primary">
      <div class="stat-card stat-card-large">
        <div class="stat-label">Streak</div>
        <div class="stat-value">5 days</div>
      </div>

      <div class="stat-card stat-card-large">
        <div class="stat-label">Tier</div>
        <div class="stat-value">Gold</div>
      </div>
    </div>

    <div class="profile-stats-secondary">
      <div class="stat-card stat-card-small">
        <div class="stat-label">Fan Score</div>
        <div class="stat-value">12,450</div>
      </div>

      <div class="stat-card stat-card-small">
        <div class="stat-label">Fan Coins</div>
        <div class="stat-value">320</div>
      </div>

      <div class="stat-card stat-card-small">
        <div class="stat-label">Fan Rank</div>
        <div class="stat-value">#128</div>
      </div>

      <div class="stat-card stat-card-small">
        <div class="stat-label">Engagement</div>
        <div class="stat-value">78%</div>
      </div>
    </div>

  </div>

  <!-- BIO -->
  <div class="profile-bio">
    Lifelong Oilers fan. Built for playoffs. Living for big moments.
  </div>

</div>

<!-- =========================
BOTTOM BAR (INNER PAGES)
========================= -->
<div class="bottom-bar">

  <!-- HOME -->
  <div class="topbar-left">
    <a class="home-btn" href="index.html">
      <img src="images/icons/fanatical.png" alt="Home">
    </a>
  </div>

  <!-- NAV BAR -->
  <div class="bottom-bar-center navbar">

    <a class="top-nav-btn" href="quiz-hub.html">
      <img src="images/icons/quiz.jpeg" alt="Quiz">
    </a>

    <a class="top-nav-btn" href="news.html">
      <img src="images/icons/news.png" alt="News">
    </a>

    <a class="top-nav-btn" href="fanbase.html">
      <img src="images/icons/events.png" alt="Fanbase">
    </a>

    <a class="top-nav-btn" href="cheer.html">
      <img src="images/icons/cheer.png" alt="Cheer">
    </a>

  </div>

  <!-- PROFILE -->
  <a class="profile-icon" href="profile.html">
    <img src="images/logos/profile.jpg" alt="Profile">
  </a>

</div>

</body>
</html>
