<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANatical - Cheer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="page cheer-page">

  <!-- CHEER HEADER / CONTROL BAR -->
  <div class="cheer-control-bar">
    <button class="cheer-checkin-btn">Check In</button>

    <div class="cheer-title-block">
      <h2>Cheer</h2>
    </div>

    <button class="cheer-add-btn" aria-label="Add Cheer">+</button>
  </div>

  <!-- CHEER LIST -->
  <div class="cheer-list">

    <article class="cheer-card">
      <div class="cheer-text-block">
        <h3 class="cheer-title">D-Fence Clap Clap</h3>
        <p class="cheer-meta">Football · Call & Response</p>
      </div>

      <div class="cheer-actions">
        <button aria-label="Play Chant">▶</button>
        <button aria-label="Lyrics">📄</button>
      </div>
    </article>

    <article class="cheer-card">
      <div class="cheer-text-block">
        <h3 class="cheer-title">Let’s Go Oilers</h3>
        <p class="cheer-meta">Hockey · Normal</p>
      </div>

      <div class="cheer-actions">
        <button aria-label="Play Chant">▶</button>
        <button aria-label="Lyrics">📄</button>
      </div>
    </article>

    <article class="cheer-card">
      <div class="cheer-text-block">
        <h3 class="cheer-title">East Side / West Side Echo Chant</h3>
        <p class="cheer-meta">Hockey · East/West</p>
      </div>

      <div class="cheer-actions">
        <button aria-label="Play Chant">▶</button>
        <button aria-label="Lyrics">📄</button>
      </div>
    </article>

  </div>

</div>

<!-- =========================
BOTTOM BAR (INNER PAGES)
========================= -->
<div class="bottom-bar">

  <!-- HOME -->
  <div class="topbar-left">
    <a class="home-btn" href="index.html">
      <img src="images/icons/fanatical.png" alt="Home">
    </a>
  </div>

  <!-- NAV BAR -->
  <div class="bottom-bar-center navbar">

    <a class="top-nav-btn" href="quiz-hub.html">
      <img src="images/icons/quiz.jpeg" alt="Quiz">
    </a>

    <a class="top-nav-btn" href="news.html">
      <img src="images/icons/news.png" alt="News">
    </a>

    <a class="top-nav-btn" href="fanbase.html">
      <img src="images/icons/events.png" alt="Fanbase">
    </a>

    <a class="top-nav-btn" href="cheer.html">
      <img src="images/icons/cheer.png" alt="Cheer">
    </a>

  </div>

  <!-- PROFILE -->
  <a class="profile-icon" href="profile.html">
    <img src="images/logos/profile.jpg" alt="Profile">
  </a>

</div>

</body>
</html>
